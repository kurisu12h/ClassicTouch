<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>App icon (Timeline)</title>
<style>
  /* App icon, 1024 × 1024: white background, one thick black rule, a large "2007" (where the Timeline starts), one red bar. The system adds the rounded corners */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  .bar { position: absolute; left: 172px; right: 172px; top: 262px; height: 22px; background: #111; }
  .year { position: absolute; left: 0; right: 0; top: 344px; text-align: center; color: #111;
          font: bold 440px/1 "DIN Condensed", sans-serif; letter-spacing: -4px; }
  .red { position: absolute; left: 172px; width: 300px; top: 716px; height: 40px; background: #d7261e; }
</style></head>
<body>
<div class="bar"></div>
<div class="year">2007</div>
<div class="red"></div>
</body></html>
