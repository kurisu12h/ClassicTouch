<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>方案 C 现代卡片：运行中</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: #000; color: #fff; }
  .glass { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(20px);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
  .back { top: 60px; left: 14px; height: 38px; padding: 0 14px 0 8px; border-radius: 19px; display: flex; align-items: center; gap: 2px;
          font: 500 15px -apple-system, "PingFang SC"; }
  .more { top: 60px; right: 14px; width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; }
  .title { top: 60px; left: 0; right: 0; text-align: center; pointer-events: none; }
  .title .t { font: 600 15px -apple-system, "PingFang SC"; }
  .title .s { margin-top: 2px; font: 12px -apple-system, "PingFang SC"; color: #8e929c; font-variant-numeric: tabular-nums; }
  .screen { top: 116px; left: 0; width: 402px; height: 603px; }
  .screen img { width: 100%; height: 100%; display: block; }
  .dock { top: 752px; left: 50%; width: 252px; margin-left: -126px; height: 62px; border-radius: 31px; display: flex; align-items: center; padding: 0 6px; }
  .dock .b { flex: 1; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; gap: 8px;
             font: 600 15px -apple-system, "PingFang SC"; }
  .dock .b.home { background: rgba(255,255,255,.14); }
  .dock .sep { width: 1px; height: 26px; background: rgba(255,255,255,.14); margin: 0 4px; }
</style></head>
<body>
<div class="abs back glass"><span data-icon="back 20 #fff 2.2"></span>列表</div>
<div class="abs title"><div class="t">iPhone 4</div><div class="s">iOS 7.1.2 · JIT · 0:54</div></div>
<div class="abs more glass" data-icon="more 20 #fff"></div>

<div class="abs screen"><img src="assets/guest-ios7.png"></div>

<div class="abs dock glass">
  <div class="b home"><span data-icon="ring 20 #fff 2.2"></span>Home</div>
  <div class="sep"></div>
  <div class="b"><span data-icon="power 19 #fff 2.2"></span>电源</div>
</div>

<script src="common.js"></script>
<script>fillDevices(); hostChrome('#fff');</script>
</body></html>
