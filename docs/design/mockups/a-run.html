<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>方案 A 年表：运行中</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 运行时换成黑底，免得白边抢客体画面；排版和首页一样：大号年份、细线、方正的按钮 */
  body { background: #000; color: #fff; }
  .num { font-family: "DIN Condensed", "DIN Alternate", -apple-system; font-weight: bold; }
  .yr { top: 60px; left: 22px; font-size: 48px; line-height: 48px; color: #fff; }
  .cap { top: 64px; left: 106px; }
  .cap .t { font: 600 16px -apple-system, "PingFang SC"; }
  .cap .s { margin-top: 3px; font: 12.5px -apple-system, "PingFang SC"; color: #8e8e93; font-variant-numeric: tabular-nums; }
  .more { top: 64px; right: 14px; width: 36px; height: 36px; display: grid; place-items: center; }
  .rule { top: 120px; left: 22px; right: 22px; height: 1px; background: #2c2c2e; }
  .screen { top: 136px; left: 21px; width: 360px; height: 540px; outline: 1px solid #2c2c2e; }
  .screen img { width: 100%; height: 100%; display: block; }
  .ctl { top: 712px; left: 22px; right: 22px; height: 64px; display: flex; gap: 10px; }
  .ctl .b { flex: 1; border: 1.5px solid #48484a; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
            font: 600 15px -apple-system, "PingFang SC"; }
  .ctl .b.home { flex: 1.25; background: #fff; color: #000; border-color: #fff; }
</style></head>
<body>
<div class="abs yr num">2012</div>
<div class="abs cap"><div class="t">iPhone 3GS</div><div class="s">iOS 6.1.6 · JIT · 0:54</div></div>
<div class="abs more" data-icon="more 22 #fff"></div>
<div class="abs rule"></div>

<div class="abs screen"><img src="assets/guest-ios6.png"></div>

<div class="abs ctl">
  <div class="b"><span data-icon="back 18 #fff 2.2"></span>年表</div>
  <div class="b home"><span data-icon="ring 19 #000 2.4"></span>Home</div>
  <div class="b"><span data-icon="power 18 #fff 2.2"></span>电源</div>
</div>

<script src="common.js"></script>
<script>fillDevices(); hostChrome('#fff');</script>
</body></html>
