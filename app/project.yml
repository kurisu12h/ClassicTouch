# The minimal app shell of the classic iOS time machine (working title). The project is generated with XcodeGen: cd app && xcodegen generate
# The bundle ID is a placeholder without Apple trademarks; the app name and the like are for the user to decide.
# The signing team is not in the repository; when installing on a phone, pass DEVELOPMENT_TEAM=... on the command line (see docs/reports/m1-stage1.md).
name: ClassicTouch
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ClassicTouch:
    type: application
    platform: iOS
    sources:
      - path: ClassicTouch
    info:
      path: ClassicTouch/Info.plist
      properties:
        CFBundleDisplayName: Unlock
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Device files live in Documents, visible in the Files app and in Finder; copying a .ctpack in imports it (ImportManager)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lets the app check whether StikDebug is installed (canOpenURL); without this canOpenURL always returns false
        LSApplicationQueriesSchemes: [stikjit]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.classictouch.app
        PRODUCT_NAME: ClassicTouch
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # The embed script reads work/ios outside the repository
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # UI text is in ClassicTouch/Localizable.xcstrings (English source, Simplified Chinese translation); a new language only touches that file
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Embed qemu-ios dylib
        script: '"${SRCROOT}/../scripts/ios/embed-qemu.sh"'
        basedOnDependencyAnalysis: false
